name: Story controls focused regression (temporary)
on:
  push:
    branches:
      - feature/story-camera-jump-dash-20261123
    paths:
      - '.github/workflows/story-controls-fast-check.yml'
jobs:
  focused-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check asset versions
        run: node tools/version-runner-assets.mjs --check
      - name: Run Story, terrain, jump, and controller regressions
        run: node --test --test-concurrency=1 tests/story-camera-jump-dash.test.mjs tests/story-manual-controls.test.mjs tests/runner-edge-grace.test.mjs tests/terrain-traversal.test.mjs tests/runner-input.test.mjs
