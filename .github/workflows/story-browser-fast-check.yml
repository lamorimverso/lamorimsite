name: Story browser focused regression (temporary)
on:
  push:
    branches:
      - feature/story-camera-jump-dash-20261123
    paths:
      - '.github/workflows/story-browser-fast-check.yml'
      - 'tanahoraflavio/runner-scenery.mjs'
      - 'tests/retro-parallax-background.test.mjs'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and artwork dependencies
        run: npm install --no-save --ignore-scripts playwright@1.56.1 sharp@0.35.5 @napi-rs/canvas@0.1.100
      - name: Confirm browser is available
        run: test -x /usr/bin/google-chrome
      - name: Run targeted real browser controls and Story progression
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 --test-name-pattern='(teclado atravessa toda a largura útil|seletor oferece dois modos jogáveis|campanha abre sem trocar o modo)' tests/ux-site.test.cjs
      - name: Verify original retro city backdrops in Canvas and browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 tests/retro-parallax-background.test.mjs tests/arena-scenery.test.mjs tests/journey-scenery.test.mjs
